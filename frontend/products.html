<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LogEase product management" />
    <title>LogEase | Products</title>
    <link rel="stylesheet" href="style.css?v=2" />
</head>

<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="index.html" aria-label="LogEase dashboard home">
                <span class="brand-mark" aria-hidden="true">L</span>
                <span>LogEase</span>
            </a>
            <nav class="topbar-nav" aria-label="Primary navigation">
                <a class="nav-link" href="stock.html">Stock</a>
                <a class="nav-link active" href="products.html">Products</a>
                <a class="nav-link" href="drivers.html">Drivers</a>
                <a class="nav-link" href="vehicles.html">Vehicles</a>
                <a class="nav-link" href="retailers.html">Retailers</a>
                <a class="nav-link" href="deliveries.html">Deliveries</a>
                <a class="nav-link" href="invoices.html">Invoices</a>
                <a class="nav-link" href="reports.html">Reports</a>
                <a class="nav-link" href="audit-logs.html">Audit Logs</a>
                <a class="nav-link" href="index.html">Dashboard</a>
            </nav>
        </header>

        <main class="product-page">
            <section class="page-heading" aria-labelledby="products-title">
                <p class="eyebrow">Catalog</p>
                <h1 id="products-title">Products</h1>
                <p class="welcome-copy">Manage the products available in your godown.</p>
            </section>

            <section class="product-layout" aria-label="Product management">
                <form class="product-form" id="product-form">
                    <div class="section-heading">
                        <div>
                            <p class="eyebrow">Product details</p>
                            <h2 id="form-title">Add product</h2>
                        </div>
                        <button class="text-button hidden" id="cancel-edit" type="button">Cancel</button>
                    </div>

                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" required />

                    <label for="category">Category</label>
                    <input id="category" name="category" type="text" required />

                    <label for="pack-size">Pack size</label>
                    <input id="pack-size" name="packSize" type="text" placeholder="e.g. 25 kg" required />

                    <label for="selling-price">Selling price</label>
                    <input id="selling-price" name="sellingPrice" type="number" min="0" step="0.01" required />

                    <button class="primary-button" type="submit" id="submit-product">Add product</button>
                    <p class="form-message" id="form-message" role="status"></p>
                </form>

                <section class="product-list" aria-labelledby="product-list-title">
                    <div class="section-heading list-heading">
                        <div>
                            <p class="eyebrow">Inventory catalog</p>
                            <h2 id="product-list-title">All products</h2>
                        </div>
                        <label class="search-box" for="product-search">
                            <span class="sr-only">Search products</span>
                            <input id="product-search" type="search" placeholder="Search products" />
                        </label>
                    </div>

                    <p class="list-message" id="list-message" role="status">Loading products...</p>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th scope="col">Name</th>
                                    <th scope="col">Category</th>
                                    <th scope="col">Pack size</th>
                                    <th scope="col">Price</th>
                                    <th scope="col">Status</th>
                                    <th scope="col"><span class="sr-only">Actions</span></th>
                                </tr>
                            </thead>
                            <tbody id="product-table-body"></tbody>
                        </table>
                    </div>
                </section>
            </section>
        </main>
    </div>

    <script src="auth.js"></script>
    <script src="products.js?v=1"></script>
</body>

</html>
